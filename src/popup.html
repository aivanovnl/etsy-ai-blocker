<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Filter for Etsy</title>
<style>
  body { width: 300px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; color: #2b2320; }
  .header { background: #F26639; color: #fff; padding: 14px 16px; }
  .header h1 { font-size: 15px; margin: 0; font-weight: 700; }
  .header p { font-size: 11.5px; margin: 4px 0 0; opacity: 0.92; }
  .section { padding: 14px 16px; border-bottom: 1px solid #eee; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .row:last-child { margin-bottom: 0; }
  label { font-size: 13px; font-weight: 600; }
  select { font-size: 12.5px; padding: 4px 6px; border-radius: 6px; border: 1px solid #ccc; }
  .switch { position: relative; width: 38px; height: 21px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: #ccc; border-radius: 999px; transition: .15s; }
  .slider:before { content: ""; position: absolute; height: 15px; width: 15px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .15s; }
  input:checked + .slider { background: #F26639; }
  input:checked + .slider:before { transform: translateX(17px); }
  .stats { display: flex; gap: 10px; }
  .stat { flex: 1; background: #fbf7f5; border-radius: 8px; padding: 8px; text-align: center; }
  .stat .n { font-size: 18px; font-weight: 800; color: #F26639; }
  .stat .l { font-size: 10.5px; color: #6b5750; margin-top: 2px; }
  .add-row { display: flex; gap: 6px; }
  .add-row input { flex: 1; font-size: 12px; padding: 6px 8px; border-radius: 6px; border: 1px solid #ccc; }
  .add-row button { font-size: 12px; padding: 6px 10px; border-radius: 6px; border: none; background: #F26639; color: #fff; font-weight: 700; cursor: pointer; }
  .msg { font-size: 11px; color: #6b5750; margin-top: 6px; min-height: 14px; }
  .footer { padding: 10px 16px; font-size: 10.5px; color: #999; text-align: center; }
  .footer a { color: #999; }
</style>
</head>
<body>
  <div class="header">
    <h1>AI Filter for Etsy</h1>
    <p>Hides likely AI-mass-produced listings from search.</p>
  </div>

  <div class="section">
    <div class="row">
      <label>Enabled</label>
      <label class="switch">
        <input type="checkbox" id="enabled">
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <label>Sensitivity</label>
      <select id="sensitivity">
        <option value="low">Low (known shops only)</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="stats">
      <div class="stat"><div class="n" id="today">0</div><div class="l">hidden today</div></div>
      <div class="stat"><div class="n" id="total">0</div><div class="l">hidden total</div></div>
    </div>
  </div>

  <div class="section">
    <label>Report a shop (adds to your personal filter)</label>
    <div class="add-row" style="margin-top:8px;">
      <input type="text" id="shopInput" placeholder="Etsy shop name">
      <button id="addBtn">Add</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="footer">
    Community blocklist updates automatically. Not affiliated with Etsy.
  </div>

  <script src="popup.js"></script>
</body>
</html>
